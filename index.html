<html lang="pt-BR">
<head>

<title>Escritório Batista</title>

<meta property="og:title" content="Escritório Batista">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --paper: #ece3d3;
    --card: #f7f1e5;
    --ink: #251f19;
    --ink-soft: #5c5344;
    --bordeaux: #6d1524;
    --bordeaux-deep: #430b15;
    --bordeaux-line: rgba(109, 21, 36, 0.32);
    --whatsapp: #25d366;
    --whatsapp-deep: #1a9c4d;
    --focus: #b08a3e;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    min-height: 100vh;
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at 15% 8%, rgba(109,21,36,0.05), transparent 45%),
      radial-gradient(ellipse at 85% 92%, rgba(109,21,36,0.05), transparent 45%);
    color: var(--ink);
    font-family: "Work Sans", -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-inline: 20px;
    padding-block: max(40px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
  }

  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--bordeaux-line);
    border-radius: 6px;
    padding: clamp(32px, 7vw, 48px) clamp(24px, 6vw, 40px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
    box-shadow: 0 1px 2px rgba(37, 31, 25, 0.06), 0 18px 40px -24px rgba(37, 31, 25, 0.35);
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px solid rgba(109, 21, 36, 0.16);
    border-radius: 3px;
    pointer-events: none;
  }

  .seal {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: radial-gradient(120% 120% at 32% 22%, #9a2438 0%, var(--bordeaux-deep) 65%, #26060b 100%);
    border: 1px solid var(--bordeaux-line);
    display: grid;
    place-items: center;
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 28px;
    color: #f2ddd2;
    margin-bottom: 6px;
    flex: none;
  }

  h1 {
    margin: 0;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.6rem, 5vw, 2rem);
    line-height: 1.12;
    color: var(--bordeaux-deep);
    text-wrap: balance;
  }

  .tagline {
    margin: 0 0 4px;
    font-size: 0.98rem;
    font-weight: 500;
    color: var(--ink-soft);
  }

  .prompt {
    margin: 4px 0 2px;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--bordeaux);
    font-weight: 600;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    margin-top: 10px;
  }

  .lnk {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    border-radius: 12px;
    padding: 15px 18px;
    font-size: 1rem;
    font-weight: 600;
    background: #fffdf9;
    color: var(--ink);
    border: 1px solid var(--bordeaux-line);
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .lnk:hover { border-color: var(--bordeaux); background: #fffaf0; transform: translateY(-1px); }
  .lnk svg { width: 19px; height: 19px; flex: none; }

  .lnk.primary {
    background: var(--whatsapp);
    border-color: var(--whatsapp);
    color: #ffffff;
    box-shadow: 0 10px 24px -12px rgba(26, 156, 77, 0.55);
  }
  .lnk.primary:hover { background: var(--whatsapp-deep); border-color: var(--whatsapp-deep); }

  .arrow { color: var(--bordeaux); font-size: 0.9em; margin-left: 2px; }
  .lnk.primary .arrow { color: rgba(255,255,255,0.85); }

  footer {
    margin-top: 22px;
    font-size: 0.76rem;
    color: var(--ink-soft);
    text-align: center;
    max-width: 34ch;
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    .lnk { transition: none; }
  }
</style>
</head>

    <a class="lnk" href="mailto:jessbatistdir@gmail.com">

        <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/>
        <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.4"/>

  </nav>

</body>
</html>
